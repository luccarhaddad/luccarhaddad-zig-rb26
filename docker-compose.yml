services:
  app1:
    image: luccarhaddad/rinha-2026-zig:v1
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "120MB"

  app2:
    image: luccarhaddad/rinha-2026-zig:v1
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "120MB"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 9999:9999
    depends_on:
      - app1
      - app2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "110MB"

networks:
  rinha:
    driver: bridge
